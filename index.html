<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>German Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <div class="card-image">
      <img src="tooth.png" alt="tooth" />
    </div>

    <div class="card-content">
      <div class="card-header">
        <span class="label">문법적 성</span>
        <h2 class="title">
          Zahn <span class="sub">이</span>
        </h2>
      </div>

      <div class="card-body">
        <div class="row">
          <span class="case red">1격 Nominativ</span>
          <span class="desc">der Zahn</span>
        </div>
        <div class="row">
          <span class="case red">3격 Dativ</span>
          <span class="desc">dem Zahn</span>
        </div>
        <div class="row">
          <span class="case red">4격 Akkusativ</span>
          <span class="desc">den Zahn</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
