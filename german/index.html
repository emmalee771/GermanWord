<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>German</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" />
  <style>
    :root { font-family: "Nunito Sans", system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f9f9f9; color: #111; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    h1 { margin: 0 0 16px; font-size: 28px; font-weight: 800; }
    p { margin: 0 0 24px; color: #555; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    a.card {
      display: block;
      padding: 16px 18px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.06);
      text-decoration: none;
      color: inherit;
    }
    a.card strong { display:block; font-size: 16px; margin-bottom: 4px; }
    a.card span { color:#666; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>German</h1>
    <p>원하는 페이지를 선택하세요.</p>
    <div class="grid">
      <a class="card" href="../german_artikel_word/">
        <strong>german_artikel_word</strong>
        <span>단어 카드</span>
      </a>
      <a class="card" href="../german_artikel_sentence/">
        <strong>german_artikel_sentence</strong>
        <span>문장 연습(준비중)</span>
      </a>
    </div>
  </main>
</body>
</html>
